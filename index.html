<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="decent.music is coming soon." />
    <meta name="theme-color" content="#f4f7fb" />
    <title>decent.music — Coming Soon</title>
    <style>
      :root {
        color-scheme: light;
        --primary-color: #3b86f6;
        --text-color: #231f20;
        --background-color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--background-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }

      .coming-soon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2rem);
      }

      .wordmark {
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin: 0;
        line-height: 1;
      }

      .wordmark__logo {
        display: block;
        width: auto;
        height: clamp(5rem, 16vw, 10rem);
      }

      .wordmark__extension {
        color: var(--primary-color);
        font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
        font-size: clamp(3rem, 12vw, 7.5rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        margin-left: -0.01em;
        margin-top: 0.12em;
      }

      .status {
        margin: 0;
        font-size: clamp(0.75rem, 1.4vw, 0.95rem);
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="coming-soon" aria-labelledby="site-title">
        <h1 class="wordmark" id="site-title">
          <img
            class="wordmark__logo"
            src="assets/images/decent.png"
            alt="decent"
            width="4836"
            height="1926"
          /><span class="wordmark__extension">.music</span>
        </h1>
        <p class="status">Coming Soon</p>
      </section>
    </main>
  </body>
</html>
