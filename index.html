<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="decent.music is coming soon." />
    <meta name="theme-color" content="#f4efe6" />
    <title>decent.music — Coming Soon</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f4efe6;
        --foreground: #181817;
        --accent: #ba4c2f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }

      .coming-soon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2rem);
      }

      .wordmark {
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin: 0;
        font-size: clamp(3.25rem, 12vw, 8rem);
        font-weight: 800;
        letter-spacing: -0.075em;
        line-height: 0.9;
      }

      .wordmark__name {
        letter-spacing: -0.085em;
      }

      .wordmark__extension {
        color: var(--accent);
        font-size: 0.36em;
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .status {
        margin: 0;
        font-size: clamp(0.75rem, 1.4vw, 0.95rem);
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="coming-soon" aria-labelledby="site-title">
        <h1 class="wordmark" id="site-title">
          <span class="wordmark__name">decent</span><span class="wordmark__extension">.music</span>
        </h1>
        <p class="status">Coming Soon</p>
      </section>
    </main>
  </body>
</html>
